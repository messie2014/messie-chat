/* =========================
   PROFIL
========================= */

.profile-page {
    position: fixed;

    background: #f1f3f6;

}

.profile-header {

    padding: 0 15px;

}

<script>

    /* =====================================================
       CONFIGURATION SUPABASE
    ===================================================== */

    const SUPABASE_URL =
        "https://dulaaqomngjaheuytltd.supabase.co";


    /*
       IMPORTANT :

       Remplace uniquement la valeur ci-dessous
       par TA Publishable Key.

       Ne change pas l'URL ci-dessus.
    */

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_JSoJ7-FlUDTaYvZT9nwYZw_64r-GmSI";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );


    /* =====================================================
       VARIABLES
    ===================================================== */

    let currentUser = null;

    let currentContact = null;


    const loading =
        document.getElementById("loading");


    const authPage =
        document.getElementById("authPage");


    const mainHeader =
        document.getElementById("mainHeader");


    const contactsPage =
        document.getElementById("contactsPage");


    const conversationPage =
        document.getElementById("conversationPage");


    const contactList =
        document.getElementById("contactList");


    const chat =
        document.getElementById("chat");


    const messageInput =
        document.getElementById("messageInput");


    const authError =
        document.getElementById("authError");


    const authSuccess =
        document.getElementById("authSuccess");


    const menu =
        document.getElementById("menu");
const profilePage =
    document.getElementById("profilePage");

const profileUsername =
    document.getElementById("profileUsername");

const profileFullName =
    document.getElementById("profileFullName");

const profileBio =
    document.getElementById("profileBio");

const profilePhoto =
    document.getElementById("profilePhoto");
const profileMessage =
    document.getElementById("profileMessage");

const profilePhotoInput =
    document.getElementById("profilePhotoInput");


/* =====================================================
   SÉLECTION PHOTO DE PROFIL
===================================================== */

profilePhotoInput.addEventListener(
    "change",
    function() {

        const file =
            this.files[0];

        if (!file) {
            return;
        }

        if (!file.type.startsWith("image/")) {

            alert("Sélectionne une image.");

            this.value = "";

            return;
        }

        if (file.size > 5 * 1024 * 1024) {

            alert(
                "La photo ne doit pas dépasser 5 Mo."
            );

            this.value = "";

            return;
        }

        const imageURL =
            URL.createObjectURL(file);

        profilePhoto.src =
            imageURL;

    }
);
    /* =====================================================
       INITIALISATION
    ===================================================== */

    async function initializeApp() {

        try {

            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth.getSession();


            if (session && session.user) {

                currentUser =
                    session.user;

                await showMainApp();

            } else {

                showAuthentication();

            }


        } catch (error) {

            console.error(error);

            showAuthentication();

        }

    }


    /* =====================================================
       CHANGEMENT DE SESSION
    ===================================================== */

    supabaseClient.auth.onAuthStateChange(
        async function(event, session) {

            if (session && session.user) {

                currentUser =
                    session.user;

                await showMainApp();

            } else {

                currentUser = null;

                showAuthentication();

            }

        }
    );


    /* =====================================================
       AFFICHER AUTHENTIFICATION
    ===================================================== */

    function showAuthentication() {

        loading.style.display =
            "none";

        authPage.style.display =
            "flex";

        mainHeader.style.display =
            "none";

        contactsPage.style.display =
            "none";

        conversationPage.style.display =
            "none";

    }


    /* =====================================================
       AFFICHER APPLICATION
    ===================================================== */

    async function showMainApp() {

        loading.style.display =
            "none";

        authPage.style.display =
            "none";

        mainHeader.style.display =

    async function signup() {

        clearAuthMessages();


        const username =
            document
                .getElementById("signupUsername")
                .value
                .trim();


        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim();


        const password =
            document
                .getElementById("signupPassword")
                .value;


        if (!username) {

            showError(
                "Entre un nom d'utilisateur."
            );

            return;

        }


        if (username.length < 3) {

            showError(
                "Le nom d'utilisateur doit avoir au moins 3 caractères."
            );

            return;

        }


        if (!email) {

            showError(
                "Entre ton adresse e-mail."
            );

            return;

        }


        if (password.length < 6) {

            showError(
                "Le mot de passe doit contenir au moins 6 caractères."
            );

            return;

        }


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        data: {

                            username:
                                username

                        }

                    }

                });


            if (error) {

                showError(
                    translateAuthError(
                        error.message
                    )
                );

                return;

            }


            /*
               Avec Confirm email désactivé,
               Supabase connectera normalement
               directement l'utilisateur.
            */

            if (
                data.session &&
                data.user
            ) {

                showSuccess(
                    "Compte créé avec succès !"
                );

            } else {

                showSuccess(
                    "Compte créé. Tu peux maintenant te connecter."
                );

                showLogin();

            }


        } catch (error) {

            console.error(error);

            showError(
                "Impossible de créer le compte."
            );

        }

    }

    /* =====================================================
   MESSAGES EN TEMPS RÉEL
===================================================== */

let messagesChannel = null;


function subscribeToMessages() {

    if (!currentUser) {
        return;
    }


    if (messagesChannel) {

        supabaseClient.removeChannel(
            messagesChannel
        );

        messagesChannel = null;

    }


    messagesChannel =
        supabaseClient
            .channel(
                "messages-" + currentUser.id
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",
                    schema: "public",
                    table: "messages"
                },
                function(payload) {

                    const message =
                        payload.new;


                    if (
                        !message ||
                        !currentContact
                    ) {

                        return;

                    }


                    const isConversationMessage =
                        (
                            message.sender_id ===
                            currentUser.id
                            &&
                            message.receiver_id ===
                            currentContact.id
                        )
                        ||
                        (
                            message.sender_id ===
                            currentContact.id
                            &&
                            message.receiver_id ===
                            currentUser.id
                        );


                    if (
                        !isConversationMessage
                    ) {

                        return;

                    }


                    /*
                       Évite d'afficher deux fois
                       un message déjà ajouté
                       immédiatement après l'envoi.
                    */

                    const alreadyDisplayed =
                        document.querySelector(
                            `[data-message-id="${message.id}"]`
                        );


                    if (
                        alreadyDisplayed
                    ) {

                        return;

                    }


                    displayMessage(
                        message
                    );


                    chat.scrollTop =
                        chat.scrollHeight;

                }
            )
            .subscribe();

        }
    /* =====================================================
   AFFICHER UN MESSAGE
===================================================== */

function displayMessage(message) {

    if (!message) {
        return;
    }


    const messageElement =
        document.createElement("div");
    messageElement.dataset.messageId =
    message.id;


    if (
        message.sender_id === currentUser.id
    ) {

        messageElement.className =
            "message user-message";

    } else {

        messageElement.className =
            "message contact-message";

    }


    const date =
        new Date(
            message.created_at
        );


    const time =
        date.getHours()
            .toString()
            .padStart(2, "0")
        +
        ":"
        +
        date.getMinutes()
            .toString()
            .padStart(2, "0");


    if (message.voice_url) {

    const audio = document.createElement("audio");

    audio.controls = true;
    audio.src = message.voice_url;

    messageElement.appendChild(audio);

} else {

    messageElement.appendChild(
        document.createTextNode(
            message.content || ""
        )
    );
}

const timeElement =
    document.createElement("span");

timeElement.className = "time";
timeElement.textContent = time;

messageElement.appendChild(timeElement);


    chat.appendChild(
        messageElement
    );

}

async function saveProfile() {

    if (!currentUser) {
        return;
    }

    const fullName =
        profileFullName.value.trim();

    const bio =
        profileBio.value.trim();

    const file =
        profilePhotoInput.files[0];

    try {

        profileMessage.textContent =
            "Enregistrement...";


        let avatarUrl = null;


        /* =====================================================
           ENVOYER LA PHOTO DANS SUPABASE STORAGE
        ===================================================== */

        if (file) {

            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const fileName =
                currentUser.id +
                "-" +
                Date.now() +
                "." +
                fileExtension;


            const filePath =
                currentUser.id +
                "/" +
                fileName;


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from("avatars")
                    .upload(
                        filePath,
                        file,
                        {
                            cacheControl: "3600",
                            upsert: true
                        }
                    );


            if (uploadError) {

                console.error(
                    "Erreur upload photo :",
                    uploadError
                );

                profileMessage.textContent =
    "Erreur : " + uploadError.message;

                return;
            }


            /* =================================================
               RÉCUPÉRER L'URL PUBLIQUE
            ================================================= */

            const {
                data: publicUrlData
            } =
                supabaseClient
                    .storage
                    .from("avatars")
                    .getPublicUrl(
                        filePath
                    );


            avatarUrl =
                publicUrlData.publicUrl;

        }


        /* =====================================================
           PRÉPARER LES DONNÉES DU PROFIL
        ===================================================== */

        const profileData = {

            full_name:
                fullName,

            bio:
                bio

        };


        /*
           On ajoute avatar_url seulement
           lorsqu'une nouvelle photo a été sélectionnée.
        */

        if (avatarUrl) {

            profileData.avatar_url =
                avatarUrl;

        }


        /* =====================================================
           ENREGISTRER LE PROFIL
        ===================================================== */

        const {
            error
        } =
            await supabaseClient
                .from("profiles")
                .update(profileData)
                .eq(
                    "id",
                    currentUser.id
                );


        if (error) {

            console.error(
                "Erreur sauvegarde profil :",
                error
            );

            profileMessage.textContent =
    "Impossible d'enregistrer les modifications.";

            return;
        }


        /* =====================================================
           ACTUALISER L'IMAGE
        ===================================================== */

        if (avatarUrl) {

            profilePhoto.src =
                avatarUrl;

        }


        profileMessage.textContent =
            "Profil enregistré avec succès.";


        /*
           Réinitialise le champ fichier
           après l'enregistrement.
        */

        profilePhotoInput.value = "";


    } catch (error) {

        console.error(
            "Erreur inattendue :",
            error
        );

        profileMessage.textContent =
            "Une erreur est survenue.";

    }

}

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

async function toggleVoiceRecording() {

    const voiceButton = document.getElementById("voiceButton");

    if (!isRecording) {

        try {

            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

            audioChunks = [];

            mediaRecorder =
                new MediaRecorder(stream);

            mediaRecorder.ondataavailable = function(event) {

                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }

            };

            mediaRecorder.onstop = async function() {

                const audioBlob =
                    new Blob(audioChunks, {
                        type: "audio/webm"
                    });

                stream.getTracks().forEach(track => {
                    track.stop();
                });

                voiceButton.textContent = "🎤";

                await sendVoiceMessage(audioBlob);
            };

            mediaRecorder.start();

            isRecording = true;

            voiceButton.textContent = "⏹️";

        } catch (error) {

            console.error(
                "Erreur microphone :",
                error
            );

            alert(
                "Impossible d'accéder au microphone."
            );
        }

    } else {

        mediaRecorder.stop();

        isRecording = false;
    }
}

        voice_url: audioUrl
    });

        // Afficher le vocal dans la conversation
        const chat =
            document.getElementById("chat");

        const audio =
            document.createElement("audio");

        audio.controls = true;
        audio.src = audioUrl;

        const message =
            document.createElement("div");

        message.className =
            "message user-message";

        message.appendChild(audio);

        chat.appendChild(message);

        chat.scrollTop =
            chat.scrollHeight;

    } catch (error) {

        console.error(
            "Erreur message vocal :",
            error
        );

        alert(
            "Une erreur est survenue."
        );
    }
}
</script>
