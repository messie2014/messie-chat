<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Messie Chat</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            height: 100dvh;
            overflow: hidden;
        }

        .app {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        /* HEADER */

        .header {
            height: 65px;
            min-height: 65px;
            background: #075e54;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .status {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 3px;
        }

        /* CHAT */

        .chat {
            flex: 1;
            min-height: 0;
            padding: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            background: #efeae2;
            padding-bottom: 20px;
        }

        .welcome {
            text-align: center;
            margin-top: 30px;
            color: #555;
        }

        .welcome h2 {
            margin-bottom: 8px;
            color: #075e54;
        }

        .welcome p {
            margin-top: 5px;
        }

        /* MESSAGES */

        .message {
            margin: 10px 0;
            padding: 10px 13px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .user-message {
            background: #d9fdd3;
            margin-left: auto;
        }

        .bot-message {
            background: white;
            margin-right: auto;
        }

        .time {
            display: block;
            font-size: 10px;
            color: #777;
            margin-top: 5px;
            text-align: right;
        }

        /* ZONE D'ÉCRITURE */

        .input-area {
            min-height: 70px;
            padding: 10px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f2f5;
            border-top: 1px solid #ddd;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            min-width: 0;
            height: 48px;
            border: none;
            outline: none;
            padding: 13px 16px;
            border-radius: 25px;
            font-size: 15px;
            background: white;
        }

        .send-button {
            width: 48px;
            min-width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #075e54;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-button:active {
            transform: scale(0.95);
        }

        /* MENU */

        .menu-button {
            background: transparent;
            border: none;
            color: white;
            font-size: 25px;
            cursor: pointer;
            width: 40px;
            height: 40px;
        }

        .menu {
            position: absolute;
            top: 60px;
            right: 10px;
            background: white;
            width: 190px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
            overflow: hidden;
            z-index: 10;
        }

        .menu button {
            width: 100%;
            border: none;
            background: white;
            padding: 15px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
        }

        .menu button:hover {
            background: #f1f1f1;
        }

        /* PETITS ÉCRANS */

        @media (max-width: 400px) {

            .header {
                height: 60px;
                min-height: 60px;
                padding: 0 12px;
            }

            .logo {
                font-size: 19px;
            }

            .status {
                font-size: 11px;
            }

            .chat {
                padding: 10px;
                padding-bottom: 20px;
            }

            .input-area {
                min-height: 68px;
                padding-left: 8px;
                padding-right: 8px;
            }

            .input-area input {
                font-size: 14px;
                padding-left: 14px;
                padding-right: 14px;
            }

            .send-button {
                width: 46px;
                min-width: 46px;
                height: 46px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div>
            <div class="logo">Messie Chat</div>
            <div class="status">🟢 En ligne</div>
        </div>

        <button
            class="menu-button"
            onclick="toggleMenu()"
            aria-label="Menu"
        >
            ⋮
        </button>

    </header>

    <div class="menu" id="menu">

        <button onclick="nouvelleConversation()">
            💬 Nouvelle conversation
        </button>

        <button onclick="alert('Le profil sera disponible bientôt.')">
            👤 Mon profil
        </button>

        <button onclick="alert('Les paramètres arrivent bientôt.')">
            ⚙️ Paramètres
        </button>

    </div>

    <main class="chat" id="chat">

        <div class="welcome">

            <h2>Bienvenue 👋</h2>

            <p>Bienvenue sur Messie Chat.</p>

            <p>Commence une conversation.</p>

        </div>

    </main>

    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Écris un message..."
